[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warren"
description = "Give every git worktree its own isolated local world — ports, env, database, URLs — so a swarm of agents runs in parallel without collisions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrei Silva" }]
keywords = ["worktree", "dev-environment", "agents", "isolation", "ports", "parallel"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
dynamic = ["version"]
dependencies = [
  "typer>=0.12",
  "pydantic>=2",
  "psutil>=5.9",
  "textual>=0.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
mcp = [
  "mcp>=1.0",
]

# One extra per adapter — installing Warren for Redis should not pull boto3.
# `all-adapters` is the convenience roll-up for "I want the whole matrix".
postgres = ["psycopg[binary]>=3"]
redis = ["redis>=5"]
mysql = ["PyMySQL>=1.1"]
mongodb = ["pymongo>=4.6"]
s3 = ["boto3>=1.34"]
kafka = ["kafka-python>=2.1"]
# rabbitmq and qdrant drive plain REST management APIs — no driver needed.
all-adapters = [
  "psycopg[binary]>=3",
  "redis>=5",
  "PyMySQL>=1.1",
  "pymongo>=4.6",
  "boto3>=1.34",
  "kafka-python>=2.1",
]

[project.scripts]
warren = "warren.cli:app"

[tool.hatch.version]
path = "src/warren/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/warren"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
