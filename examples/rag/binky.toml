# A vector-search app where every worktree gets its own embedded corpus.
#
#   export BINKY_PG_ADMIN=postgres://postgres:postgres@localhost:5432/postgres
#   binky up feature-a
#   binky up feature-b
#   curl "http://api.feature-a.rag.localhost/?q=isolated+database"
#
# The corpus is embedded ONCE into a golden template; feature-b is a copy of it,
# not a second embedding run. See README.md.
[project]
name = "rag"

[services.db]
adapter = "postgres"
# Never inline a password here — this file is committed. `${env.X}` reads the
# environment; `env_file` reads a gitignored file.
admin_url = "${env.BINKY_PG_ADMIN}"
migrate = "python migrate.py"
seed = "python seed.py"
# Build the expensive world once, then copy it per worktree.
clone_from = "corpus"

[services.api]
cmd = "python api.py"
url = "api"
depends_on = ["db"]
env = { DATABASE_URL = "${db.url}" }

# What `binky env <worktree>` hands to an agent (or to you).
[agents]
expose = ["db", "api"]
