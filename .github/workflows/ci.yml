name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # Include the mcp extra so build_server() is actually exercised against the
        # real SDK — without it test_build_server_registers_tools skips, which is how
        # the FastMCP→MCPServer class move (mcp 1.x→2.x) slipped through once.
        run: python -m pip install -e ".[dev,mcp]"
      - name: Lint
        run: python -m ruff check src tests examples benchmarks
      - name: Test
        run: python -m pytest -q

  # Ten backends in one job made a single container failure look like a suite failure
  # and serialised the wait. Split by weight: the datastores most projects actually
  # run, and everything else. The gated tests skip on whatever a job doesn't provide.
  adapters-core:
    name: adapter integration (core datastores)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # MinIO needs entrypoint arguments the `services:` block cannot express.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data

      # Not a TCP probe: `docker run -p` binds the host port through docker-proxy
      # the instant the container is created, so a connect succeeds long before
      # anything inside is listening. Ask the server itself.
      - name: Wait for MinIO
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "minio is up"; exit 0
            fi
            sleep 2
          done
          echo "minio never came up"; docker logs minio || true; exit 1

      # MySQL reports `clone` only when a client that can authenticate against the
      # server is on PATH. Ubuntu's `mysql-client` matches the mysql:8 service, so
      # this is what keeps the clone path from being quietly skipped in CI.
      - name: Install the MySQL client (exercises the clone path)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client

      - name: Install
        run: python -m pip install -e ".[dev,all-adapters]"

      - name: Test against real servers
        env:
          BINKY_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres
          BINKY_TEST_REDIS: redis://localhost:6379
          BINKY_TEST_MYSQL: mysql://root:mysql@localhost:3306
          BINKY_TEST_MONGO: mongodb://localhost:27017
          BINKY_TEST_S3: http://localhost:9000
          BINKY_TEST_S3_KEY: minioadmin
          BINKY_TEST_S3_SECRET: minioadmin
        run: python -m pytest -q tests/test_adapters.py tests/test_builtin_adapters.py

      - name: Assert the MySQL clone path actually ran
        run: |
          python - <<'PY'
          from binky import adapters
          caps = adapters.get("mysql", {"admin_url": "mysql://root:mysql@localhost:3306"}).capabilities()
          assert caps["clone"], f"CI must exercise the mysql clone path, got {caps}"
          print("mysql clone capability confirmed in CI")
          PY

      - name: Container logs on failure
        if: failure()
        run: docker logs minio || true

  adapters-extra:
    name: adapter integration (messaging, search, analytics)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Start Kafka, Qdrant, ClickHouse and Elasticsearch
        run: |
          docker run -d --name qdrant -p 6333:6333 qdrant/qdrant
          docker run -d --name clickhouse -p 8123:8123 \
            -e CLICKHOUSE_SKIP_USER_SETUP=1 \
            clickhouse/clickhouse-server:24
          # Elasticsearch is the heaviest container here; cap the JVM so it cannot
          # starve the rest of the job, and drop security (this is a scratch cluster).
          docker run -d --name elasticsearch -p 9200:9200 \
            -e discovery.type=single-node \
            -e xpack.security.enabled=false \
            -e xpack.security.enrollment.enabled=false \
            -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" \
            docker.elastic.co/elasticsearch/elasticsearch:8.15.0
          docker run -d --name kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            apache/kafka:3.9.0

      # An open port proves nothing here: docker-proxy binds the host side as soon
      # as the container is created, so `</dev/tcp/...` succeeds while the server
      # inside is still booting — which is how Elasticsearch got as far as the test
      # run and reset the connection mid-request. Ask each server whether it is
      # ready. Kafka speaks no HTTP, so it keeps the TCP check; its client retries
      # on its own, which is what covered the gap there.
      - name: Wait for them
        run: |
          ready() {
            name="$1"; url="$2"
            for _ in $(seq 1 90); do
              if curl -fsS "$url" >/dev/null 2>&1; then echo "$name is ready"; return 0; fi
              sleep 2
            done
            echo "$name never became ready"; docker logs "$name" || true; return 1
          }
          ready qdrant        http://127.0.0.1:6333/readyz
          ready clickhouse    http://127.0.0.1:8123/ping
          ready elasticsearch "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
          for _ in $(seq 1 90); do
            if timeout 1 bash -c "</dev/tcp/127.0.0.1/9092" 2>/dev/null; then
              echo "kafka port is up"; exit 0
            fi
            sleep 2
          done
          echo "kafka never came up"; docker logs kafka || true; exit 1

      - name: Install
        run: python -m pip install -e ".[dev,all-adapters]"

      - name: Test against real servers
        env:
          BINKY_TEST_RABBITMQ: http://guest:guest@localhost:15672
          BINKY_TEST_KAFKA: kafka://localhost:9092
          BINKY_TEST_QDRANT: http://localhost:6333
          BINKY_TEST_CLICKHOUSE: http://default:@localhost:8123
          BINKY_TEST_ELASTICSEARCH: http://localhost:9200
        run: python -m pytest -q tests/test_adapters.py tests/test_builtin_adapters.py

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs kafka || true
          docker logs clickhouse || true
          docker logs elasticsearch || true
          docker logs qdrant || true
