name: Release

# Tag-triggered, maintainer-approved publish to PyPI via Trusted Publishing (OIDC):
# no long-lived API token lives anywhere. Push a tag `vX.Y.Z` after bumping
# __version__ and updating CHANGELOG.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    # Configure this environment in repo settings with a required reviewer so a
    # publish cannot fire without a human approving it.
    environment: release
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC) — mints a short-lived credential
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      # Publishes everything in dist/ and generates PEP 740 attestations automatically.
      # skip-existing tolerates a re-run or a version already on PyPI (e.g. one pushed
      # out-of-band) instead of hard-failing the whole release on a duplicate file.
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](CHANGELOG.md) for details."
